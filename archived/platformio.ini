[platformio]
default_envs = native

[env:native]
platform = native
extra_scripts =
  pre:set_program_name.py
  pre:get_boost.py
  pre:scripts/build_dashboard_wasm.py
  pre:scripts/embed_memory_dashboard_dist.py
  pre:scripts/generate_notcurses_builddef.py
  pre:scripts/configure_system_libs.py
  pre:scripts/build_llama_cpp.py
  pre:scripts/clang_tidy_target.py
custom_memory_dashboard_build = false
custom_memory_dashboard_build_type = Release
custom_memory_dashboard_dist = dashboard_wasm/web/dist
lib_deps =
  https://github.com/p-ranav/argparse.git#d924b84eba1f0f0adf38b20b7b4829f6f65b6570
  https://github.com/nlohmann/json.git#4fad4468974a7b1b26d374b1c5955d2ac7d449b0
  https://github.com/gabime/spdlog.git#2e71fdf3c1e8d6299b8129e402ab705e6fb494ba
  https://github.com/anjo76/angelscript.git#0601da029d846a658bf23f2888e953a45a94450a
  https://github.com/uni-algo/uni-algo.git#6c091fa266ac03a852128429af3b7481cf50a0ab
  https://github.com/mity/md4c.git#5f9b246fd01e90afa8075c1b6c2904ea44375fe3
  https://github.com/dankamongmen/notcurses.git#da0943ab11fb81874776455c6c02b89cace39eaa
  https://github.com/eliaskosunen/scnlib.git#4b8a7400ce34208fa47b9abec492a6497a7ab48c
  https://github.com/foonathan/lexy.git#c1358c4117752393e9ce27d6c885d9146846f2f9
  https://github.com/synesissoftware/recls.git#33d5b03d1f789405385c462b7e43510743bb7a15
  https://github.com/synesissoftware/STLSoft-1.11.git#21743a52244e464f6bda0951b4c570f99a63d060
  https://github.com/julesgrc0/FFS.git#73e5727cb30cbec09a9bb3bb3d59401b9dac4326
lib_ignore =
  argparse
  scnlib
  lexy
  recls
  STLSoft-1
  STLSoft-1.11
  FFS
  llama.cpp
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Wpedantic
  -DSPDLOG_COMPILED_LIB
  -DSCN_DISABLE_FAST_FLOAT=1
  -DSCN_DISABLE_REGEX=1
  -DBOOST_DISABLE_PRAGMA_MESSAGE=
  -D_XOPEN_SOURCE=700
  -D_GNU_SOURCE
  -D_DEFAULT_SOURCE
  -Iinclude
  -Isrc/index/tree_sitter_runtime
  -I$BUILD_DIR/generated
  -I$BUILD_DIR/generated/sysroot/usr/include
  -Ilib/boost_1_86_0
  -I.pio/libdeps/$PIOENV/argparse/include
  -I.pio/libdeps/$PIOENV/json/include
  -I.pio/libdeps/$PIOENV/spdlog/include
  -I.pio/libdeps/$PIOENV/uni-algo/include
  -I.pio/libdeps/$PIOENV/md4c/src
  -I.pio/libdeps/$PIOENV/notcurses/include
  -I.pio/libdeps/$PIOENV/notcurses/src
  -I.pio/libdeps/$PIOENV/scnlib/include
  -I.pio/libdeps/$PIOENV/scnlib/src
  -I.pio/libdeps/$PIOENV/lexy/include
  -I.pio/libdeps/$PIOENV/recls/include
  -I.pio/libdeps/$PIOENV/STLSoft-1/include
  -I.pio/libdeps/$PIOENV/STLSoft-1.11/include
  -I.pio/libdeps/$PIOENV/FFS
  -Ilib/llama.cpp/include
  -Ilib/llama.cpp/ggml/include
  -Ilib/llama.cpp/ggml/src
  -Ilib/llama.cpp/src
  -pthread
  -lsqlite3
  -ltinfo
  -lz
  -ldl
  -lm
  -lrt
build_unflags =
  -std=gnu++11
test_framework = custom
test_build_src = no

[env:native_full]
extends = env:native
