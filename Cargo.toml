[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/qt-app", "crates/qt-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
qt-core = { path = "crates/qt-core" }

anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
tokio-util = "0.7"

rusqlite = { version = "0.37", features = ["bundled"] }
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"

gpui-kit = "0.10.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
