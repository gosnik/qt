<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>qtmem Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --statusbar-height: 3.25rem;
      --bg: #070c18;
      --panel: rgba(9, 16, 30, 0.92);
      --text: #eef6ff;
      --muted: #a6b6c9;
      --accent: #5ce1e6;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #0b1325 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .viewport {
      position: fixed;
      inset: 0 0 var(--statusbar-height) 0;
      min-height: 0;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
      outline: none;
    }

    .statusbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--statusbar-height);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
      min-height: var(--statusbar-height);
      padding: 0.45rem max(0.9rem, env(safe-area-inset-right)) calc(0.45rem + env(safe-area-inset-bottom)) max(0.9rem, env(safe-area-inset-left));
      box-sizing: border-box;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.875rem;
    }

    .statusbar h1 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .statusbar-left {
      align-items: center;
      display: grid;
      grid-template-columns: minmax(7.5rem, max-content) minmax(0, 1fr);
      gap: 0.75rem;
      min-width: 0;
    }

    .statusbar-right {
      color: var(--muted);
      white-space: nowrap;
      font-size: 0.78rem;
    }

    #status-display {
      margin: 0;
      color: var(--accent);
      font-family: inherit;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 34rem) {
      :root { --statusbar-height: 4.75rem; }
      .statusbar { grid-template-columns: minmax(0, 1fr); gap: 0.2rem; }
      .statusbar-left { grid-template-columns: minmax(6.25rem, max-content) minmax(0, 1fr); gap: 0.5rem; }
      .statusbar h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .statusbar-right { justify-self: end; }
    }
  </style>
</head>
<body>
<main class="viewport">
  <canvas id="canvas" class="emscripten" tabindex="0" role="application" aria-label="qtmem Dashboard interactive canvas" oncontextmenu="event.preventDefault()">qtmem Dashboard requires a browser with canvas support.</canvas>
</main>
<footer class="statusbar">
  <div class="statusbar-left">
    <h1>qtmem Dashboard</h1>
    <p id="status-display" role="status" aria-live="polite">Booting qtmem WASM runtime…</p>
  </div>
  <div class="statusbar-right">ImGui + WebAssembly</div>
</footer>

<script>
  var Module = {
    preRun: [],
    postRun: [],
    print: function(text) {
      if (text) console.log(text);
    },
    printErr: function(text) {
      if (text) console.error(text);
    },
    setStatus: function(text) {
      var statusDisplay = document.getElementById("status-display");
      if (statusDisplay) {
        statusDisplay.textContent = text || "Ready";
      }
    },
    locateFile: function(path) {
      return "/dashboard/" + path;
    },
    canvas: (function() {
      return document.getElementById("canvas");
    })()
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
